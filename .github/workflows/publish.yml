name: Publish indexes

# Public repo avmaps-faa-index  →  .github/workflows/publish.yml
# Triggered by an avmaps import workflow (repository_dispatch, event type
# `index-built`) right after it uploads the `<dataset>-index` artifact.
#   client_payload: { repo: "owner/avmaps", run_id: "<import run id>", dataset: "pma|airports|tail|acref|engref" }
# Serves  https://j1-was-taken.github.io/avmaps-faa-index/                      (human index page)
#         https://j1-was-taken.github.io/avmaps-faa-index/index.json            (machine index)
#         https://j1-was-taken.github.io/avmaps-faa-index/<dataset>/manifest.json
#         https://j1-was-taken.github.io/avmaps-faa-index/<dataset>/idx-<v>.bin.gz
#
# A Pages deploy REPLACES the whole site. So every publish re-assembles all
# datasets: the new one from the artifact, the others copied from the live site.
# A live dataset that cannot be fetched fails the job (never deploy a site that
# silently lost a dataset); a dataset that is not published yet (404) is skipped.
#
# Manual runs (Actions → Publish indexes → Run workflow):
#   • redeploy_only = true  → no artifact needed. Rebuilds the site purely from
#                             the live copies of every dataset (use this to
#                             refresh index.html / index.json, or to re-push
#                             the site when nothing new exists).
#   • force = true          → publish a dataset even if its v already matches
#                             the live one (still needs dataset/repo/run_id).
#
# `v` is the first 16 hex of sha256 of the RAW (gunzipped) bin, never of the .gz
# (gzip bytes depend on the runner's zlib build). Validate accordingly.
# `fmt` must be `<dataset>-idx/<number>`; the worker decides whether it supports it.
on:
  repository_dispatch:
    types: [index-built]
  workflow_dispatch:
    inputs:
      redeploy_only:
        description: "Redeploy only: rebuild the site from the live datasets (ignores dataset/repo/run_id)"
        required: false
        type: boolean
        default: false
      force:
        description: "Force: deploy even if the dataset's v already matches the live one"
        required: false
        type: boolean
        default: false
      dataset:
        description: "Dataset to publish (not needed for redeploy_only)"
        required: false
        type: choice
        options: [pma, airports, tail, acref, engref]
      repo:
        description: "Source repo (owner/name), e.g. owner/avmaps (not needed for redeploy_only)"
        required: false
      run_id:
        description: "Run id of the import workflow that uploaded <dataset>-index (artifact lives 3 days; not needed for redeploy_only)"
        required: false

# One publish at a time: each one assembles the site from the live copy of the
# other datasets, so two parallel publishes would overwrite each other.
# NOTE: GitHub keeps only ONE pending run per group; stagger the import crons.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  DATASETS: "pma airports tail acref engref"

jobs:
  prepare:
    name: Download artifact → compare with live → assemble site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.compare.outputs.skip }}
    steps:
      - name: Resolve mode and dataset
        id: ds
        env:
          DATASET: ${{ github.event.client_payload.dataset || inputs.dataset }}
          SRC_REPO: ${{ github.event.client_payload.repo || inputs.repo }}
          SRC_RUN: ${{ github.event.client_payload.run_id || inputs.run_id }}
          REDEPLOY: ${{ inputs.redeploy_only }}
        run: |
          set -euo pipefail
          if [ "$REDEPLOY" = "true" ]; then
            echo "mode=redeploy" >> "$GITHUB_OUTPUT"
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "### 🔁 Redeploy only: rebuilding the site from the live datasets" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$DATASET" in
            pma|airports|tail|acref|engref) ;;
            *) echo "unknown dataset '$DATASET'"; exit 1 ;;
          esac
          [ -n "$SRC_REPO" ] || { echo "repo is required unless redeploy_only is set"; exit 1; }
          [ -n "$SRC_RUN" ] || { echo "run_id is required unless redeploy_only is set"; exit 1; }
          echo "mode=publish" >> "$GITHUB_OUTPUT"
          echo "name=$DATASET" >> "$GITHUB_OUTPUT"

      - name: Download index artifact
        if: steps.ds.outputs.mode == 'publish'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.ds.outputs.name }}-index
          path: new
          repository: ${{ github.event.client_payload.repo || inputs.repo }}
          run-id: ${{ github.event.client_payload.run_id || inputs.run_id }}
          github-token: ${{ secrets.AVMAPS_ARTIFACT_TOKEN }}

      - name: Validate artifact
        id: new
        if: steps.ds.outputs.mode == 'publish'
        env:
          DATASET: ${{ steps.ds.outputs.name }}
        run: |
          set -euo pipefail
          test -f new/manifest.json
          V=$(jq -er '.v' new/manifest.json)
          FMT=$(jq -er '.fmt' new/manifest.json)
          FILE=$(jq -er '.file' new/manifest.json)
          BYTES=$(jq -er '.bytes' new/manifest.json)
          GZ=$(jq -er '.gz' new/manifest.json)
          case "$FMT" in
            "${DATASET}-idx/"[0-9]*) ;;
            *) echo "unexpected fmt $FMT for dataset $DATASET"; exit 1 ;;
          esac
          [[ "$V" =~ ^[0-9a-f]{16}$ ]] || { echo "bad v"; exit 1; }
          [ "$FILE" = "idx-${V}.bin.gz" ] || { echo "file/v mismatch"; exit 1; }
          test -f "new/$FILE"
          [ "$(ls new | wc -l)" = "2" ] || { echo "unexpected extra files"; ls new; exit 1; }
          gzip -t "new/$FILE"
          [ "$(stat -c%s "new/$FILE")" = "$GZ" ] || { echo "gz size mismatch"; exit 1; }
          gzip -dc "new/$FILE" > "$RUNNER_TEMP/raw.bin"
          [ "$(stat -c%s "$RUNNER_TEMP/raw.bin")" = "$BYTES" ] || { echo "raw size mismatch"; exit 1; }
          [ "$(sha256sum "$RUNNER_TEMP/raw.bin" | cut -c1-16)" = "$V" ] || { echo "v is not sha256 of the RAW bin"; exit 1; }
          rm -f "$RUNNER_TEMP/raw.bin"
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: Compare with live manifest
        id: compare
        if: steps.ds.outputs.mode == 'publish'
        env:
          DATASET: ${{ steps.ds.outputs.name }}
          NEW_V: ${{ steps.new.outputs.v }}
          FORCE: ${{ inputs.force }}
        run: |
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          LIVE=$(curl -fsS --max-time 20 "${BASE}/${DATASET}/manifest.json?cb=$(date +%s)" | jq -r '.v // "none"' 2>/dev/null || echo none)
          echo "${DATASET}: live v=${LIVE} new v=${NEW_V}"
          if [ "$LIVE" = "$NEW_V" ] && [ "$FORCE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "### ℹ️ ${DATASET} already live at v=${NEW_V} — deploy skipped (run with force=true to redeploy anyway)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            if [ "$LIVE" = "$NEW_V" ]; then
              echo "### ⚠️ ${DATASET} already live at v=${NEW_V} — redeploying anyway (force)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Assemble site (new dataset + live copies of the others)
        if: steps.compare.outputs.skip != 'true'
        env:
          DATASET: ${{ steps.ds.outputs.name }}
        run: |
          set -euo pipefail
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          mkdir -p site
          if [ -n "$DATASET" ]; then
            mkdir -p "site/${DATASET}"
            cp new/* "site/${DATASET}/"
          fi
          for d in $DATASETS; do
            [ "$d" = "$DATASET" ] && continue
            code=$(curl -sS --max-time 20 -o "$RUNNER_TEMP/m.json" -w '%{http_code}' "${BASE}/${d}/manifest.json?cb=$(date +%s)")
            if [ "$code" = "404" ]; then echo "${d}: not published yet, skipping"; continue; fi
            [ "$code" = "200" ] || { echo "${d}: live manifest returned HTTP ${code}"; exit 1; }
            FILE=$(jq -er '.file' "$RUNNER_TEMP/m.json")
            GZ=$(jq -er '.gz' "$RUNNER_TEMP/m.json")
            [[ "$FILE" =~ ^idx-[0-9a-f]{16}\.bin\.gz$ ]] || { echo "${d}: bad file name in live manifest"; exit 1; }
            mkdir -p "site/${d}"
            curl -fsS --max-time 300 -o "site/${d}/${FILE}" "${BASE}/${d}/${FILE}"
            gzip -t "site/${d}/${FILE}"
            [ "$(stat -c%s "site/${d}/${FILE}")" = "$GZ" ] || { echo "${d}: gz size mismatch"; exit 1; }
            cp "$RUNNER_TEMP/m.json" "site/${d}/manifest.json"
            echo "${d}: kept live $(jq -r '.v' "$RUNNER_TEMP/m.json")"
          done
          [ -n "$(find site -mindepth 1 -maxdepth 1 -type d)" ] || { echo "nothing to publish: no dataset is live and none was supplied"; exit 1; }
          find site -type f | sort

      - name: Generate root index
        if: steps.compare.outputs.skip != 'true'
        run: |
          set -euo pipefail
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          cd site

          # Machine-readable index (shape unchanged: one key per dataset).
          echo '{}' > index.json
          for d in */; do
            d=${d%/}
            jq --arg d "$d" --slurpfile m "$d/manifest.json" \
              '.[$d] = ($m[0] + {manifest: "\($d)/manifest.json", url: "\($d)/\($m[0].file)"})' \
              index.json > tmp.json && mv tmp.json index.json
          done

          # Human-readable index: every link the site serves.
          {
            echo '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>avmaps-faa-index</title>'
            echo '<style>body{font:15px/1.5 system-ui,sans-serif;max-width:60rem;margin:2rem auto;padding:0 1rem}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:.4rem .6rem;border-bottom:1px solid #ddd;vertical-align:top}code,pre{font-size:13px}pre{background:#f5f5f5;padding:.75rem;overflow:auto}</style>'
            echo '<h1>avmaps-faa-index</h1>'
            echo "<p>Built $(date -u +'%Y-%m-%d %H:%M UTC')</p>"
            echo '<table><tr><th>Dataset</th><th>Rows</th><th>Built (UTC)</th><th>Version</th><th>Format</th><th>Download / raw</th><th>Links</th></tr>'
            for d in */; do
              d=${d%/}
              m="$d/manifest.json"
              v=$(jq -r '.v // "?"' "$m")
              fmt=$(jq -r '.fmt // "?"' "$m")
              file=$(jq -r '.file // "?"' "$m")
              n=$(jq -r '.n // "?"' "$m" | sed ':a;s/\B[0-9]\{3\}\>/,&/;ta')
              built=$(jq -r '(.built // "?") | sub("T"; " ") | .[0:16]' "$m")
              gz=$(jq -r '.gz // 0' "$m" | numfmt --to=iec --format='%.1f')
              raw=$(jq -r '.bytes // 0' "$m" | numfmt --to=iec --format='%.1f')
              echo "<tr><td><b>$d</b></td><td>$n</td><td>$built</td><td><code>$v</code></td><td><code>$fmt</code></td><td>$gz / $raw</td><td><a href=\"$d/manifest.json\">manifest</a> · <a href=\"$d/$file\">data (.bin.gz)</a></td></tr>"
            done
            echo '</table>'
            echo '<h2>JSON index</h2><ul><li><a href="index.json">index.json</a> (all datasets in one file, for scripts)</li></ul>'
            echo '<h2>Full URLs</h2><pre>'
            echo "$BASE/"
            echo "$BASE/index.json"
            for d in */; do
              d=${d%/}
              file=$(jq -r '.file // "?"' "$d/manifest.json")
              echo "$BASE/$d/manifest.json"
              echo "$BASE/$d/$file"
            done
            echo '</pre>'
          } > index.html

      - name: Upload Pages artifact
        if: steps.compare.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: echo "### ✅ Published ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
